name: iOS 15 Build

on:
  push:
    branches:
      - master
      - release
      - develop
    tags:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - release
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.0'

jobs:
  build-ios15:
    name: Build iOS 15 archive
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        run: |
          JAVA_HOME="$('/usr/libexec/java_home' -v 17)"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version

      - name: Restore Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      - name: Restore Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan/dependencies
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}-
            ${{ runner.os }}-konan-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install iOS platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing iOS platform (attempt ${attempt}/3)."
            if xcodebuild -downloadPlatform iOS; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to install the iOS platform after three attempts.' >&2
              exit 1
            fi
            # Xcode 26 runners occasionally leave CoreSimulator unavailable after selection.
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sudo killall -9 SimulatorTrampoline 2>/dev/null || true
            sleep 15
          done
          xcodebuild -showsdks | grep 'iphoneos'

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Add optional Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            mkdir -p appleApp/Firebase
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -D > appleApp/Firebase/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 is not set; Firebase config will not be bundled."
          fi

      - name: Generate Xcode project
        working-directory: appleApp
        run: xcodegen generate --spec project.yml

      - name: Restore Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Flare-*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('appleApp/project.yml', 'appleApp/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('appleApp/project.yml', 'appleApp/**/Package.resolved') }}-
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Resolve Swift Package dependencies
        working-directory: appleApp
        run: xcodebuild -project Flare.xcodeproj -scheme iOS -resolvePackageDependencies -skipPackagePluginValidation -skipMacroValidation

      - name: Build unsigned iOS 15 archive
        working-directory: appleApp
        env:
          # Kotlin/Native links the shared framework during this step; the upstream 4 GB
          # Gradle heap is insufficient for the OpenAI client IR on a clean runner.
          GRADLE_JVM_ARGS: '-Xmx5g -Dfile.encoding=UTF-8'
        run: |
          set -o pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Flare-iOS15.xcarchive"
          BUILD_LOG="$RUNNER_TEMP/flare-ios15-build.log"
          xcodebuild archive \
            -project Flare.xcodeproj \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee "$BUILD_LOG"

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Flare-iOS15.xcarchive"
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$RUNNER_TEMP/Flare-iOS15-unsigned.ipa" Payload
          )
          shasum -a 256 "$RUNNER_TEMP/Flare-iOS15-unsigned.ipa" | tee "$RUNNER_TEMP/Flare-iOS15-unsigned.ipa.sha256"

      - name: Upload IPA and archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Flare-iOS15-unsigned.ipa
            ${{ runner.temp }}/Flare-iOS15-unsigned.ipa.sha256
            ${{ runner.temp }}/Flare-iOS15.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flare-iOS15-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/flare-ios15-build.log
          if-no-files-found: warn
          retention-days: 14
